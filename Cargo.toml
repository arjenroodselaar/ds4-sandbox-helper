[package]
name = "ds4-sandbox-helper"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Sandbox-side tool runner for ds4-agent --sandbox: framed request/response protocol plus the read/write/edit/search/list/bash tools"
license = "MPL-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "fs", "signal"] }
serde_json = "1"
regex = "1"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
